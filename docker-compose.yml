# ──────────────────────────────────────────────────────────────
# MuxroCRM Cloud — Docker Compose (Database Only)
# Backend & Frontend run via PM2 on the VPS
# Caddy runs on the VPS (not in Docker)
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ─────────────────────────────────
  # Port 5433 to avoid conflict with ProcessSutra (5432)
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crm-network

volumes:
  postgres_data:

networks:
  crm-network:
    driver: bridge
